<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Freilauf</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <!-- Self-contained on purpose: this page is served for missing paths at any depth,
     where relative asset URLs would not resolve. -->
    <style>
      :root {
        --bg: #f3f3f6;
        --text: #1b1b1f;
        --text-2: #55555d;
        --accent: #0b63d1;
        --fill: #0b63d1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0e10;
          --text: #f4f4f6;
          --text-2: #a8a8b0;
          --accent: #6aaeff;
          --fill: #2563d6;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        text-align: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }
      main {
        max-width: 32rem;
      }
      svg {
        color: var(--accent);
      }
      h1 {
        font-size: clamp(1.8rem, 1.4rem + 2vw, 2.6rem);
        letter-spacing: -0.02em;
        margin: 1rem 0 0.4rem;
      }
      p {
        color: var(--text-2);
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 1.3rem;
        margin-top: 1rem;
        border-radius: 999px;
        background: var(--fill);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a {
        color: var(--accent);
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 120 120" width="72" height="72" aria-hidden="true" focusable="false">
        <circle
          cx="60"
          cy="60"
          r="46"
          fill="none"
          stroke="currentColor"
          stroke-width="10"
          stroke-dasharray="9 7"
        />
        <circle cx="60" cy="60" r="20" fill="none" stroke="currentColor" stroke-width="8" />
      </svg>
      <h1>Freewheeling off the route</h1>
      <p>This page does not exist. Maybe it moved, or the link has a typo.</p>
      <a class="btn" href="https://graemer-org.github.io/freilauf/">Back to Freilauf</a>
      <p><a href="https://github.com/graemer-org/freilauf">Source on GitHub</a></p>
    </main>
  </body>
</html>
