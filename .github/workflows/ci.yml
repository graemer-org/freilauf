name: CI

# Kept cheap on purpose: Linux only, and not on every push to a work branch.
# Installers are built by release.yml (tags, or a manual run).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting has not been normalised across the code base yet. Report
      # only; drop continue-on-error once `pnpm format` has been run once.
      - run: pnpm format:check
        continue-on-error: true
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Electron e2e (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm test:e2e
