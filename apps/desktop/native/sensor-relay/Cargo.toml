[package]
name = "freilauf-sensor-relay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Freilauf sensor relay: publishes the app's live values as a Bluetooth LE peripheral (GATT server)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Enumeration",
  "Storage_Streams",
  "Win32_System_WinRT",
] }
windows-future = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
