<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Strict CSP. wss: is for group rides: the public relay servers (any host,
         since the relay list can be changed in Settings) and an own signalling
         server; ws: only for an own server without TLS (local testing). WebRTC
         itself is not governed by connect-src; nothing else leaves the app. The dev
         server additions are applied by electron.vite.config.ts only in dev. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>Freilauf</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main/main.tsx"></script>
  </body>
</html>
